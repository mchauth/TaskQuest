<!DOCTYPE html><html><head><meta charset="utf-8"><title>Other</title><style>body{background:#1a1a2e;color:#eee;font-family:monospace;margin:0;padding:16px}
h1{color:#f0c040;margin-bottom:4px}nav{margin-bottom:16px}nav a{color:#a0c0ff;margin-right:12px;font-size:12px}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.card{background:#2a2a3e;border:2px solid #444;border-radius:6px;padding:6px;width:480px}
.card.on{border-color:#40ff80;background:#1a3a2a}

.row{display:flex;align-items:center;gap:6px;margin-top:4px}
.nm{font-size:10px;color:#aaa;flex:1}
.sel-btn{font-size:10px;padding:3px 8px;background:#333;border:1px solid #666;color:#ccc;cursor:pointer;border-radius:3px}
.card.on .sel-btn{background:#1a5a2a;border-color:#40ff80;color:#40ff80}

#panel h3{color:#40ff80;margin:0 0 6px}.it{color:#ccc;margin:2px 0}
#copy{display:block;width:100%;margin-top:8px;background:#40ff80;color:#000;border:none;border-radius:4px;padding:5px;cursor:pointer;font-family:monospace}
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;align-items:center;justify-content:center;flex-direction:column}
#lb.show{display:flex}
#lb img{image-rendering:pixelated;max-width:95vw;max-height:85vh;object-fit:contain}

<div id="lb" onclick="closeLb()"><img id="lb-img" src=""><div id="lb-close">✕ close</div></div>
<script>const sel=new Set();
function tog(id,n){
  const c=document.getElementById(id);
  if(sel.has(n)){sel.delete(n);c.classList.remove('on');}
  else{sel.add(n);c.classList.add('on');}
  const d=document.getElementById('sel');
  d.innerHTML=sel.size?[...sel].sort().map(x=>`<div class="it">${x}</div>`).join(''):'<em style="color:#555">None</em>';
}
function zoom(src){
  document.getElementById('lb-img').src=src;
  document.getElementById('lb').classList.add('show');
}
function closeLb(){document.getElementById('lb').classList.remove('show');}
function doCopy(){navigator.clipboard.writeText([...sel].sort().join('\n'));}</script>

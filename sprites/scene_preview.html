<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskQuest Scene Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; font-family: 'Georgia', serif;
         display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 0; }

  h2 { color: #f0c060; margin-bottom: 12px; font-size: 13px; letter-spacing: 2px;
       text-transform: uppercase; }

  .scene-wrapper {
    width: 100%; max-width: 520px;
    border: 2px solid #5a3e1b; border-radius: 8px 8px 0 0;
    overflow: hidden; box-shadow: 0 0 24px rgba(0,0,0,0.7);
  }

  /* ── Scene ── */
  .scene {
    position: relative; width: 100%; height: 200px; overflow: hidden;
  }

  /* Parallax layers */
  .parallax-layer {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background-repeat: repeat-x;
    background-size: 1024px 100%;
    image-rendering: pixelated;
  }
  /* layer5=sky (farthest back), layer1=foreground trees (closest) */
  .layer5 { z-index: 1; }
  .layer4 { z-index: 2; }
  .layer3 { z-index: 3; }
  .layer2 { z-index: 4; }
  .layer1 { z-index: 5; }

  /* Ground — Floor Tiles2.png stone tiles, 32×32 each, first row */
  .ground {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 32px; z-index: 6;
    background-image: url('preview_assets/ground.png');
    background-repeat: repeat-x;
    background-size: 288px 576px;
    background-position: 0px 0px;
    image-rendering: pixelated;
  }

  /* ── CSS Sprite layer (shared by character and campfire) ── */
  .sprite-layer {
    position: absolute;
    image-rendering: pixelated;
    background-repeat: no-repeat;
    overflow: hidden;
  }

  /* Character: 80×64 window into 800×448 sheet.
     scale(2) from bottom-center keeps it on-screen; scaleX(-1) flips to face right. */
  .char-wrap {
    position: absolute;
    bottom: 30px; left: 80px;
    width: 80px; height: 64px;
    z-index: 8;
    transform: scale(2) scaleX(-1);
    transform-origin: bottom center;
  }
  .char-layer {
    position: absolute; top: 0; left: 0;
    width: 80px; height: 64px;
    background-repeat: no-repeat;
    image-rendering: pixelated;
    /* background-size = full sheet size */
    background-size: 800px 448px;
    /* background-position set by JS: -col*80px -row*64px */
  }

  /* Campfire: individual frame PNGs, no sprite sheet math needed.
     Each frame is 33×64px, scaled up 3× = 99×192px display. */
  .campfire-wrap {
    position: absolute;
    bottom: 12px; right: 50px;
    width: 72px; height: 72px;
    z-index: 7;
  }
  #campfireImg {
    position: absolute;
    bottom: 0; left: 0;
    width: 72px; height: 72px;
    image-rendering: pixelated;
    display: block;
  }

  /* Quest stat pills */
  .quest-overlay {
    position: absolute; top: 8px; left: 0; right: 0;
    display: flex; justify-content: space-around; z-index: 10; padding: 0 12px;
  }
  .stat-pill {
    background: rgba(0,0,0,0.6); border: 1px solid rgba(255,200,80,0.35);
    border-radius: 20px; padding: 3px 10px; font-size: 10px;
    color: #f0e0a0; display: flex; align-items: center; gap: 5px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot-green  { background: #4cff80; box-shadow: 0 0 4px #4cff80; }
  .dot-yellow { background: #ffc830; box-shadow: 0 0 4px #ffc830; }
  .dot-blue   { background: #60c0ff; box-shadow: 0 0 4px #60c0ff; }

  /* State label */
  .state-label {
    position: absolute; bottom: 42px; left: 48px;
    background: rgba(0,0,0,0.65); color: #f0c060;
    font-size: 9px; padding: 2px 7px; border-radius: 10px; z-index: 9;
    animation: breathe 3s ease-in-out infinite alternate;
  }
  @keyframes breathe { from { opacity: 0.6; } to { opacity: 1; } }

  /* ── Controls ── */
  .controls {
    width: 100%; max-width: 520px;
    background: #1e1e3a; border: 2px solid #5a3e1b; border-top: none;
    border-radius: 0 0 8px 8px; padding: 10px 14px;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  .ctrl-group { display: flex; flex-direction: column; gap: 4px; }
  .ctrl-label { font-size: 9px; color: #a08060; text-transform: uppercase; letter-spacing: 1px; }
  .ctrl-row { display: flex; gap: 4px; }
  .ctrl-btn {
    width: 22px; height: 22px; border-radius: 4px;
    border: 1px solid #5a3e1b; cursor: pointer;
    background: #2a1e0e; font-size: 9px; color: #d0b080;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s;
  }
  .ctrl-btn.active { border-color: #f0c060; background: #4a3010; color: #f0c060; }
  .ctrl-btn:hover  { border-color: #c09040; }

  .state-toggle { margin-left: auto; display: flex; gap: 6px; }
  .toggle-btn {
    padding: 4px 12px; border-radius: 20px;
    border: 1px solid #5a3e1b; background: #2a1e0e;
    color: #d0b080; font-size: 10px; cursor: pointer; transition: all 0.15s;
  }
  .toggle-btn.active { background: #5a3010; border-color: #f0c060; color: #f0c060; }
</style>
</head>
<body>

<h2>⚔ Quest Scene Preview</h2>

<div class="scene-wrapper">
  <div class="scene">

    <!-- Parallax background -->
    <div class="parallax-layer layer1" id="l1"></div>
    <div class="parallax-layer layer2" id="l2"></div>
    <div class="parallax-layer layer3" id="l3"></div>
    <div class="parallax-layer layer4" id="l4"></div>
    <div class="parallax-layer layer5" id="l5"></div>

    <!-- Quest stats -->
    <div class="quest-overlay">
      <div class="stat-pill"><span class="dot dot-green"></span>3 Active</div>
      <div class="stat-pill"><span class="dot dot-yellow"></span>Lv 7 Warrior</div>
      <div class="stat-pill"><span class="dot dot-blue"></span>2 Complete</div>
    </div>

    <!-- Ground -->
    <div class="ground"></div>

    <!-- State label -->
    <div class="state-label" id="stateLabel">🏕 Resting by camp</div>

    <!-- Character: stacked CSS sprite layers -->
    <div class="char-wrap" id="charWrap">
      <div class="char-layer" id="charBoots"></div>
      <div class="char-layer" id="charPants"></div>
      <div class="char-layer" id="charShirt"></div>
      <div class="char-layer" id="charSkin"></div>
      <div class="char-layer" id="charSword"></div>
      <div class="char-layer" id="charHair"></div>
    </div>

    <!-- Campfire: animated GIF (self-animating) -->
    <div class="campfire-wrap">
      <img id="campfireImg" src="preview_assets/anim/fire_f0.png" alt="">
    </div>

  </div>

  <div class="controls">
    <div class="ctrl-group">
      <div class="ctrl-label">Skin</div>
      <div class="ctrl-row" id="skinBtns"></div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-label">Hair</div>
      <div class="ctrl-row" id="hairBtns"></div>
    </div>
    <div class="state-toggle">
      <button class="toggle-btn active" onclick="setState('rest')">🏕 Rest</button>
      <button class="toggle-btn" onclick="setState('active')">⚔ Active</button>
    </div>
  </div>
</div>

<script>
// ── Paths ──
const BG = [1,2,3,4,5].map(i => `preview_assets/bg/layer${i}.png`);
const CHAR_LAYERS = {
  charBoots: 'preview_assets/char/boots.png',
  charPants: 'preview_assets/char/pants.png',
  charShirt: 'preview_assets/char/shirt.png',
  charSkin:  'preview_assets/char/skin.png',
  charSword: 'preview_assets/char/sword.png',
  charHair:  'preview_assets/char/hair.png',
};
// ── Sprite sheet layout ──
// Character: 800×448, 80×64 per frame
const ANIM = {
  idle: { row: 0, frames: 5, fps: 6 },
  walk: { row: 1, frames: 8, fps: 10 },
};
// ── State ──
let currentAnim = 'idle';
let charFrame = 0;
let charLast = 0;

// ── Set parallax layers ──
BG.forEach((src, i) => {
  document.getElementById(`l${i+1}`).style.backgroundImage = `url('${src}')`;
});

// ── Set character layer images ──
Object.entries(CHAR_LAYERS).forEach(([id, src]) => {
  document.getElementById(id).style.backgroundImage = `url('${src}')`;
});

// ── Campfire setup ──
const cfImg = document.getElementById('campfireImg');
const CF_FRAME_SRCS = Array.from({length:16}, (_,f) => `preview_assets/anim/fire_f${f}.png`);
const CF = { frames: 16, fps: 12 };
let cfFrame = 0, cfLast = 0;

// ── Animation loop ──
function setCharFrame(anim, f) {
  const x = -(f * 80);
  const y = -(anim.row * 64);
  Object.keys(CHAR_LAYERS).forEach(id => {
    document.getElementById(id).style.backgroundPosition = `${x}px ${y}px`;
  });
}

function loop(ts) {
  const anim = ANIM[currentAnim];

  if (ts - charLast > 1000 / anim.fps) {
    charFrame = (charFrame + 1) % anim.frames;
    charLast = ts;
    setCharFrame(anim, charFrame);
  }

  if (ts - cfLast > 1000 / CF.fps) {
    cfFrame = (cfFrame + 1) % CF.frames;
    cfLast = ts;
    cfImg.src = CF_FRAME_SRCS[cfFrame];
  }

  requestAnimationFrame(loop);
}

setCharFrame(ANIM.idle, 0);
cfImg.src = CF_FRAME_SRCS[0];
requestAnimationFrame(loop);

// ── State switcher ──
window.setState = function(s) {
  currentAnim = s === 'rest' ? 'idle' : 'walk';
  charFrame = 0;
  document.getElementById('stateLabel').textContent =
    s === 'rest' ? '🏕 Resting by camp' : '⚔ On the march';
  document.querySelectorAll('.toggle-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && s === 'rest') || (i === 1 && s === 'active'));
  });
  document.querySelector('.campfire-wrap').style.display = s === 'rest' ? 'block' : 'none';
};

// ── Pickers (5 buttons each, cosmetic for now) ──
function buildPicker(containerId, count, onChange) {
  const el = document.getElementById(containerId);
  for (let i = 0; i < count; i++) {
    const btn = document.createElement('div');
    btn.className = 'ctrl-btn' + (i === 0 ? ' active' : '');
    btn.textContent = i + 1;
    btn.onclick = () => {
      el.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      onChange(i);
    };
    el.appendChild(btn);
  }
}
buildPicker('skinBtns', 5, i => { /* swap skin src when multiple available */ });
buildPicker('hairBtns', 5, i => { /* swap hair src when multiple available */ });
</script>
</body>
</html>

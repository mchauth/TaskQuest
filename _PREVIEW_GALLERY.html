<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TaskQuest Sprite Preview Gallery</title>
<style>
  body { background: #1a1a2e; color: #eee; font-family: monospace; margin: 0; padding: 16px; }
  h1 { color: #f0c040; margin-bottom: 4px; }
  h2 { color: #a0c0ff; border-bottom: 1px solid #444; padding-bottom: 4px; margin-top: 32px; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
  .card { background: #2a2a3e; border: 1px solid #444; border-radius: 6px; padding: 8px; text-align: center; cursor: pointer; transition: border-color 0.15s; }
  .card:hover { border-color: #f0c040; }
  .card.selected { border-color: #40ff80; background: #1a3a2a; }
  .card img { image-rendering: pixelated; display: block; }
  .card .name { font-size: 10px; color: #aaa; margin-top: 4px; max-width: 160px; word-break: break-all; }
  #selected-list { position: fixed; top: 16px; right: 16px; background: #0a0a1e; border: 1px solid #40ff80; border-radius: 8px; padding: 12px; max-width: 220px; max-height: 80vh; overflow-y: auto; font-size: 11px; }
  #selected-list h3 { color: #40ff80; margin: 0 0 8px 0; }
  #selected-list .item { color: #ccc; margin: 2px 0; }
  #copy-btn { display: block; margin-top: 8px; background: #40ff80; color: #000; border: none; border-radius: 4px; padding: 6px 10px; cursor: pointer; font-family: monospace; width: 100%; }
</style>
</head>
<body>
<h1>TaskQuest Sprite Preview Gallery</h1>
<p style="color:#888">Click cards to select for deployment. Selected items shown top-right.</p>

<div id="selected-list">
  <h3>✓ Selected to Deploy</h3>
  <div id="sel-items"><em style="color:#666">None yet</em></div>
  <button id="copy-btn" onclick="copyList()">Copy list</button>
</div>

<script>
const selected = new Set();
function toggle(el, name) {
  if (selected.has(name)) { selected.delete(name); el.classList.remove('selected'); }
  else { selected.add(name); el.classList.add('selected'); }
  const div = document.getElementById('sel-items');
  if (selected.size === 0) { div.innerHTML = '<em style="color:#666">None yet</em>'; return; }
  div.innerHTML = [...selected].sort().map(n => `<div class="item">${n}</div>`).join('');
}
function copyList() {
  navigator.clipboard.writeText([...selected].sort().join('\n'));
}
function card(path, label, scale) {
  const s = scale || 2;
  const el = document.createElement('div');
  el.className = 'card';
  el.onclick = () => toggle(el, label);
  el.innerHTML = `<img src="${path}" style="width:${160*s/2}px;height:auto"><div class="name">${label}</div>`;
  return el;
}
</script>
